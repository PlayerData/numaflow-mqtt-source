name: Lint

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings
